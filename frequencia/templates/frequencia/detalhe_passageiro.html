<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Viagens</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="nav-bar">
                <div class="logo">
                    <a>GoCheck 📍</a>
                </div>
                <div class="nav-links">
                    <ul>
                        <li><a href="relacaoviagens.html">Início</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <div class="det-card">
                <h2>Nome</h2>
                <div class="form-2parts">
                    <div class="form-field">
                        <h4>Documento:</h4>
                        <p>000.000.000-00</p>
                    </div>
                    <div class="form-field">
                        <h4>Nacionalidade:</h4>
                        <p>País</p>
                    </div>
                </div>
                <div class="form-2parts">
                    <div class="form-field">
                        <h4>Telefone do passageiro:</h4>
                        <p>(00)00000-0000</p>
                    </div>
                    <div class="form-field">
                        <h4>Data de nascimento do passageiro:</h4>
                        <p>00/00/0000</p>
                    </div>
                </div>
                <div class="form-2parts">
                    <div class="form-field">
                        <h4>Nome do contato de emergência:</h4>
                        <p>Nome</p>
                    </div>
                    <div class="form-field">
                        <h4>Telefone do contato de emergência:</h4>
                        <p>(00)00000-0000</p>
                    </div>
                </div>

                <div class="form-buttons">
                    <a href="viagem.html" class="button buttonvolta">Voltar</a>
                    <a href="viagem.html" class="button">Excluir</a>
                </div>
            </div>
        </main>
    </body>
</html>
