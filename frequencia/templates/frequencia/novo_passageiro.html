<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Viagens</title>
        <link rel="stylesheet" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,100;0,300;0,400;0,500;0,700;0,800;0,900;1,100;1,300;1,400;1,500;1,700;1,800;1,900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <nav class="nav-bar">
                <div class="logo">
                    <a>GoCheck 📍</a>
                </div>
                <div class="nav-links">
                    <ul>
                        <li><a href="relacaoviagens.html">Início</a></li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <div class="form-card">
                <h2>Cadastrar Novo Passageiro</h2>
                <div class="form-field">
                    <label for="name">Digite o nome completo do passageiro</label>
                    <input id="name" type="text" placeholder="Nome completo" required>
                </div>
                <div class="form-2parts">
                    <div class="form-field">
                        <label for="id">Digite o documento de identificação (CPF se for brasileiro)</label>
                        <input id="id" type="text" placeholder="Documento de identificação" required>
                    </div>
                    <div class="form-field">
                        <label for="nacao">Digite a nacionalidade do passageiro</label>
                        <input id="nacao" type="text" placeholder="País" required>
                    </div>
                </div>
                <div class="form-2parts">
                    <div class="form-field">
                        <label for="cellcont">Digite o telefone de contato do passageiro</label>
                        <input id="cellcont" type="text" placeholder="Ex: (00)00000-0000" required>
                    </div>
                    <div class="form-field">
                        <label for="born">Digite a data de nascimento do passageiro</label>
                        <input id="born" type="date" required>
                    </div>
                </div>
                <div class="form-2parts">
                    <div class="form-field">
                        <label for="nameeme">Digite o nome do contato de emergência</label>
                        <input id="nameeme" type="text" placeholder="Nome do contato de emergência" required>
                    </div>
                    <div class="form-field">
                        <label for="celleme">Digite o contato de emergência do passageiro</label>
                        <input id="celleme" type="text" placeholder="Ex: (00)00000-0000" required>
                    </div>
                </div>

                <div class="form-buttons">
                    <button type="submit">Criar</button>
                    <a href="relacaoviagens.html" class="button">Cancelar</a>
                </div>
            </div>
        </main>
    </body>
</html>
