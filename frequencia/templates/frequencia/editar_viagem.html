{% load static %}
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Viagem - GoCheck</title>
    <link rel="stylesheet" href="{% static 'frequencia/style.css' %}">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #333; margin-bottom: 20px; }
        form p { margin-bottom: 15px; display: flex; flex-direction: column; align-items: flex-start; }
        form label { margin-bottom: 5px; font-weight: bold; color: #444; }
        form input[type="text"], form input[type="date"], form input[type="time"], form textarea, form select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;
        }
        form textarea { resize: vertical; height: 90px; }
        .acoes-form { margin-top: 20px; display: flex; gap: 10px; }
        .btn-submit { background-color: #ffc107; color: #333; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn-submit:hover { background-color: #e0a800; }
        .btn-cancel { background-color: #6c757d; color: white; text-decoration: none; padding: 10px 20px; border-radius: 4px; display: inline-block; font-weight: bold; font-size: 15px; text-align: center; }
        .btn-cancel:hover { background-color: #5a6268; }
        .voltar-link { display: inline-block; margin-bottom: 15px; color: #007bff; text-decoration: none; font-weight: bold; }
        .voltar-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <a href="{% url 'detalhe_viagem' viagem.pk %}" class="voltar-link">&larr; Voltar para Detalhes</a>
        <h2>Editar Viagem: {{ viagem.nome }}</h2>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="acoes-form">
                <button type="submit" class="btn-submit">Guardar Alterações</button>
                <a href="{% url 'detalhe_viagem' viagem.pk %}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>

</body>
</html>
