{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GoCheck</title>
    <link rel="stylesheet" href="{% static 'frequencia/stylelogin.css' %}">
</head>
<body>

    <div class="login-container">
        <h2>Entre em sua conta</h2>

        {% if erro %}
            <p style="color: red; text-align: center; margin-bottom: 10px;">{{ erro }}</p>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div style="display: flex; flex-direction: column; gap: 15px; width: 100%;">
                
                <div style="display: flex; flex-direction: column; align-items: flex-start; width: 100%;">
                    <label for="username" style="margin-bottom: 5px; font-weight: bold;">Nome de usuário</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Nome de usuário" 
                        required
                        style="width: 100%; padding: 10px; box-sizing: border-box;"
                    >
                </div>

                <div style="display: flex; flex-direction: column; align-items: flex-start; width: 100%;">
                    <label for="password" style="margin-bottom: 5px; font-weight: bold;">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Senha" 
                        required
                        style="width: 100%; padding: 10px; box-sizing: border-box;"
                    >
                </div>

                <button type="submit" class="btn" style="margin-top: 10px; width: 100%; padding: 10px; cursor: pointer;">Entrar</button>

            </div>
        </form>
    </div>

</body>
</html>
